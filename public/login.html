<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — WC26.bets</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="card auth-card fade-in">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your account.</p>
      <form id="login-form" class="form-stack">
        <input class="input" name="email" type="email" placeholder="email" autofocus required autocomplete="email" />
        <input class="input" name="password" type="password" placeholder="password" required minlength="6" autocomplete="current-password" />
        <p class="alert" id="err" hidden></p>
        <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
      </form>
      <p class="muted center" style="margin-top:14px;font-size:14px">
        No account? <a href="/register.html" style="color:var(--neon)">Sign up</a>
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
