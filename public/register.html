<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscription — WC26.bets</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div class="card auth-card fade-in">
      <h1>Rejoins la partie</h1>
      <p class="sub">Email et mot de passe.</p>
      <form id="register-form" class="form-stack">
        <input class="input" name="email" type="email" placeholder="email" autofocus required autocomplete="email" />
        <input class="input" name="password" type="password" placeholder="mot de passe" required minlength="6" autocomplete="new-password" />
        <p class="alert" id="err" hidden></p>
        <button class="btn btn-primary" type="submit" style="width:100%">Créer le compte</button>
      </form>
      <p class="muted center" style="margin-top:14px;font-size:14px">
        Déjà inscrit ? <a href="/login.html" style="color:var(--neon)">Connexion</a>
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
