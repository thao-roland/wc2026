<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Groupes — WC26.bets</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <h1 class="page">Tes groupes</h1>
    <div class="groups-grid fade-in">
      <div id="groups-list" class="list"></div>
      <div>
        <div class="card mb-3">
          <h2 class="section">Créer un groupe</h2>
          <input id="new-name" class="input mb-2" placeholder="Nom du groupe" />
          <button id="create-btn" class="btn btn-primary" style="width:100%;margin-top:8px">Créer</button>
        </div>
        <div class="card">
          <h2 class="section">Rejoindre un groupe</h2>
          <input id="join-code" class="input mono mb-2" placeholder="CODE D'INVITATION" />
          <button id="join-btn" class="btn btn-gold" style="width:100%;margin-top:8px">Demander à rejoindre</button>
        </div>
        <p id="msg" class="success mt-2" hidden></p>
        <p id="err" class="alert mt-2" hidden></p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/groups.js"></script>
</body>
</html>
